name: ActServe CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # actessh and actesskey are private git dependencies (ssh://git@github.com/…): the git CLI
  # uses the ssh-agent loaded below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: Pure TDD Test Suite & Lints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Secret ACT_DEPS_DEPLOY_KEYS: the read-only deploy keys of actessh and actesskey, one
      # private key after the other (webfactory/ssh-agent loads them all).
      - name: Load the deploy keys of the private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACT_DEPS_DEPLOY_KEYS }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Execute 100% Pure TDD Tests
        run: cargo test --verbose
